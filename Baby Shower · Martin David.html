<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baby Shower · Martin David</title>
<style>
:root{--bg:#e6f2fb;--card:#fff;--ink:#22303f;--mut:#6b7a8c;--acc:#4a90c8;--ok:#2e9e6b;--line:#dce6f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a22;--card:#1b2631;--ink:#e8eef5;--mut:#98a8ba;--acc:#6fb1e6;--ok:#5cc596;--line:#2a3846}}
:root[data-theme="dark"]{--bg:#121a22;--card:#1b2631;--ink:#e8eef5;--mut:#98a8ba;--acc:#6fb1e6;--ok:#5cc596;--line:#2a3846}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.4}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px;position:relative;z-index:1}
header{text-align:center;margin-bottom:24px}
header h1{font-size:26px;margin:8px 0 4px}
header p{color:var(--mut);margin:4px 0;font-family:system-ui,sans-serif;font-size:15px}
h2{font-size:18px;color:var(--acc);margin:28px 0 10px;font-family:system-ui,sans-serif}
.g{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-family:system-ui,sans-serif}
.g .t{flex:1;font-size:15px}
.g .q{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.g a{background:var(--acc);color:#fff;text-decoration:none;font-size:14px;padding:8px 12px;border-radius:999px;white-space:nowrap}
.g.x .t{text-decoration:line-through;color:var(--mut)}
.g.x .ok{color:var(--ok);font-size:14px;white-space:nowrap}
.ele{display:block;width:110px;margin:14px 0}
.ele svg{width:100%;height:auto;display:block}
.ele.r{margin-left:auto;transform:scaleX(-1)}
.ele.c{margin-left:auto;margin-right:auto}
.ele.hero{width:150px}
#cielo{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
footer{text-align:center;color:var(--mut);font-size:13px;margin-top:32px;font-family:system-ui,sans-serif}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="plata" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".5" stop-color="#c3cad3"/><stop offset="1" stop-color="#9fa8b4"/></linearGradient></defs>
<symbol id="st" viewBox="0 0 100 100"><polygon points="50,5 61,38 96,38 68,58 79,92 50,71 21,92 32,58 4,38 39,38" fill="url(#plata)" stroke="#9fa8b4" stroke-width="3" stroke-linejoin="round"/></symbol>
<symbol id="ele" viewBox="0 0 120 100"><g stroke="#6fa9d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M20 52 q-12 10 -6 26 q3 8 10 3" fill="none" stroke-width="13"/><path d="M20 52 q-12 10 -6 26 q3 8 10 3" fill="none" stroke="#a9d6f5" stroke-width="9"/><rect x="38" y="68" width="13" height="24" rx="6" fill="#a9d6f5"/><rect x="56" y="70" width="13" height="22" rx="6" fill="#8cc6ee"/><rect x="78" y="68" width="13" height="24" rx="6" fill="#a9d6f5"/><rect x="95" y="66" width="13" height="26" rx="6" fill="#8cc6ee"/><ellipse cx="70" cy="56" rx="38" ry="26" fill="#a9d6f5"/><path d="M107 50 q8 4 6 16" fill="none"/><circle cx="34" cy="44" r="22" fill="#a9d6f5"/><ellipse cx="52" cy="46" rx="14" ry="19" fill="#cfe9fb"/></g><circle cx="28" cy="40" r="2.6" fill="#35566f"/><circle cx="24" cy="50" r="4" fill="#d6ecfb"/><use href="#st" x="62" y="44" width="15" height="15"/></symbol></svg>
<svg id="cielo" aria-hidden="true"><use href="#st" x="6%" y="6%" width="26" height="26"/><use href="#st" x="88%" y="10%" width="20" height="20"/><use href="#st" x="20%" y="26%" width="16" height="16"/><use href="#st" x="92%" y="34%" width="28" height="28"/><use href="#st" x="4%" y="46%" width="22" height="22"/><use href="#st" x="84%" y="58%" width="16" height="16"/><use href="#st" x="12%" y="68%" width="30" height="30"/><use href="#st" x="94%" y="76%" width="20" height="20"/><use href="#st" x="30%" y="88%" width="18" height="18"/><use href="#st" x="76%" y="92%" width="26" height="26"/></svg>
<main>
<header>
<div class="ele c hero"><svg viewBox="0 0 120 100"><use href="#ele"/></svg></div>
<h1>¡Celebremos la llegada de Martin David!</h1>
<p>Lista de deseos · Baby Shower</p>
<p>Gracias por acompañarnos en esta etapa tan especial. Elige un regalo y toca “Apartar” para avisarnos por WhatsApp.</p>
</header>
<div id="lista"></div>
<div class="ele c"><svg viewBox="0 0 120 100"><use href="#ele"/></svg></div>
<footer>Los regalos tachados ya fueron apartados 💙</footer>
</main>
<script>
var TEL="573174766433";
// t = nombre de quien lo apartó (vacío si sigue disponible)
var G=[
["Ropa","Bodies manga corta (0–3 meses)","x1",""],
["Ropa","Bodies manga corta (3–6 meses)","x1",""],
["Ropa","Bodies manga corta (6–9 meses)","x1",""],
["Ropa","Pijamas para Recién Nacido (opción 1)","x1",""],
["Ropa","Pijamas para Recién Nacido (opción 2)","x1",""],
["Ropa","Conjuntos de algodón (0–3 meses)","x1",""],
["Ropa","Conjuntos de algodón (3–6 meses)","x1",""],
["Ropa","Conjuntos de algodón (6–9 meses)","x1",""],
["Descanso","Sábanas para Cuna","x1",""],
["Descanso","Cobija suave + Pañales Etapa 2","x1",""],
["Descanso","Cobija suave + Pañales Etapa 3","x1",""],
["Descanso","Protector de Colchón","x1",""],
["Descanso","Nido Bebé Recién Nacido Reductor Cuna Suave + Kit Almohada","x1",""],
["Baño","Toalla con Capucha + Colonia bebé (opción 1)","x1",""],
["Baño","Toalla con Capucha + Colonia bebé (opción 2)","x1",""],
["Baño","Kit de Aseo “Jabón y Shampoo para Bebé” (opción 1)","x1",""],
["Baño","Kit de Aseo “Jabón y Shampoo para Bebé” (opción 2)","x1",""],
["Baño","Kit de Aseo “Kit Jhonson’s Baby Para Antes De Dormir” (opción 1)","x1",""],
["Baño","Kit de Aseo “Kit Jhonson’s Baby Para Antes De Dormir” (opción 2)","x1",""],
["Baño","Bañera Plegable Para Bebé Con Termómetro Y Cojín","x1",""],
["Alimentación","Kit Biberón Philips Avent","x1",""],
["Alimentación","Esterilizador y Calentador de Biberones","x1",""],
["Pañales e higiene","Kit “Pañales etapa 1 + Toallitas húmedas + Crema antipañalitis Desitin”","x1",""],
["Pañales e higiene","Kit “Pañales etapa 2 + Toallitas húmedas + Crema antipañalitis Desitin”","x1",""],
["Pañales e higiene","Kit “Pañales etapa 3 + Toallitas húmedas + Crema antipañalitis Desitin”","x1",""],
["Pañales e higiene","Kit “Pañales etapa 4 + Toallitas húmedas + Crema antipañalitis Desitin”","x1",""],
["Paseo","Bolso Pañalera","x1",""],
["Cuidado","Kit de cuidado (Peine, Cortaúñas, Aspirador, Termómetro Digital)","x1",""],
["Juguetes","Sonajero o Mordedor o Juguete para Bebé","x1",""],
["Otros","Regalo libre / sorpresa (opción 1)","x1",""],
["Otros","Regalo libre / sorpresa (opción 2)","x1",""],
["Otros","Regalo libre / sorpresa (opción 3)","x1",""],
["Otros","Regalo libre / sorpresa (opción 4)","x1",""]
];
var box=document.getElementById("lista"),cat="";
var E={"Descanso":"r","Baño":"l","Pañales e higiene":"r","Juguetes":"l"};
G.forEach(function(g){
  if(g[0]!==cat){cat=g[0];if(E[cat]){var e=document.createElement("div");e.className="ele "+E[cat];e.innerHTML='<svg viewBox="0 0 120 100"><use href="#ele"/></svg>';box.appendChild(e);}var h=document.createElement("h2");h.textContent=cat;box.appendChild(h);}
  var d=document.createElement("div");d.className="g"+(g[3]?" x":"");
  var t=document.createElement("div");t.className="t";t.textContent=g[1];
  if(g[2]){var q=document.createElement("span");q.className="q";q.textContent="Cantidad: "+g[2].slice(1);t.appendChild(q);}
  d.appendChild(t);
  if(g[3]){var o=document.createElement("span");o.className="ok";o.textContent="✔ Apartado";d.appendChild(o);}
  else{var a=document.createElement("a");a.textContent="Apartar";
    a.href="https://wa.me/"+TEL+"?text="+encodeURIComponent("Hola, quiero apartar este regalo para Martin David: "+g[1]+". Mi nombre es: ");
    a.target="_blank";a.rel="noopener";d.appendChild(a);}
  box.appendChild(d);
});
</script>
</body>
</html>
